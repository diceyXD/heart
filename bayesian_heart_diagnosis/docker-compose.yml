version: '3.8'

services:
  # 1. FastAPI Inference Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bayesian_heart_api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Streamlit Clinician User Interface
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bayesian_heart_ui
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
